<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tredemølle-kalkulator</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #dde1e8;
    --accent: #0f766e; --accent-ink: #ffffff; --bad: #c62828; --soft: #eef2f6;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181d24; --ink: #e8ecf1; --muted: #98a2b3; --line: #2a313b;
      --accent: #2dd4bf; --accent-ink: #06201d; --bad: #ff6b6b; --soft: #212832;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px 14px 110px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
  h2 { font-size: 1.05rem; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .sum { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .field { display: flex; gap: 6px; align-items: stretch; }
  input[type=text] {
    width: 100%; min-width: 0; font: inherit; font-size: 1.05rem; padding: 11px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  input.bad { border-color: var(--bad); }
  .unit { align-self: center; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .hint { color: var(--muted); font-size: .78rem; margin: 8px 0 0; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .9rem;
    padding: 8px 6px; border-radius: 8px; cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .sign {
    flex: 0 0 46px; border: 1.5px solid var(--line); background: var(--soft); color: var(--ink);
    border-radius: 10px; font: inherit; font-size: 1.25rem; cursor: pointer; line-height: 1;
  }
  .btn {
    display: block; width: 100%; padding: 13px; font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 12px; border: 1.5px dashed var(--line); background: transparent; color: var(--accent);
  }
  .btn:hover { border-color: var(--accent); }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .85rem;
    cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--soft); color: var(--bad); }
  .sub-title { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: .78rem; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  tr.walkrow td { color: var(--muted); font-size: .85rem; }
  label.check { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: .9rem; color: var(--ink); cursor: pointer; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
  .warn { color: var(--bad); font-size: .85rem; margin: 8px 0 0; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--soft); border-radius: 12px; padding: 10px; }
  .stat .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .k { font-size: .75rem; color: var(--muted); }
  .stat.main { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); }
  .stat.main .v { font-size: 2.1rem; }
  .stat.main .k { color: inherit; opacity: .85; }
  svg.chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 5;
  }
  .bar-in { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bar .d { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .bar .t { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>Tredemølle-kalkulator</h1>
  <p class="sub">Regn ut reell distanse. Tid du sto stille er ikke med, selv om mølla fortsatte å gå.</p>

  <section class="card" id="warm"></section>

  <div id="seriesList"></div>
  <button class="btn" data-action="add-series" style="margin-bottom:14px">+ Legg til serie</button>

  <section class="card" id="cool"></section>

  <section class="card" id="result">
    <div class="card-head"><h2>Oppsummering</h2></div>
    <div class="big">
      <div class="stat main"><div class="v" id="rDist">–</div><div class="k">Reell distanse</div></div>
      <div class="stat"><div class="v" id="rTime">–</div><div class="k">Løpetid</div></div>
      <div class="stat"><div class="v" id="rSpeed">–</div><div class="k">Snittfart (km/t)</div></div>
      <div class="stat"><div class="v" id="rPace">–</div><div class="k">Snitt min/km</div></div>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 480 190" role="img" aria-label="Fart over tid"></svg>
    <div class="legend" id="legend"></div>
    <div class="sub-title">Fordeling</div>
    <table>
      <thead><tr><th>Del</th><th>Tid</th><th>Distanse</th></tr></thead>
      <tbody id="partRows"></tbody>
    </table>
    <div id="warnings"></div>
  </section>

  <footer>Distanse = fart × tid for hver del. Alt regnes ut i nettleseren.</footer>
</main>

<div class="bar"><div class="bar-in">
  <span class="d" id="barDist">–</span>
  <span class="t" id="barTime">–</span>
</div></div>

<script>
/* <logic> */
function parseNum(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim().replace(',', '.');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  return parseFloat(s);
}
// Tid: "4:30" = 4 min 30 sek, "4,5" = 4,5 min, "1:02:03" = 1 t 2 min 3 sek. Returnerer sekunder.
function parseTime(s) {
  s = String(s === null || s === undefined ? '' : s).trim().replace(',', '.');
  if (!s) return null;
  if (s.indexOf(':') >= 0) {
    var p = s.split(':');
    if (p.length > 3) return null;
    var sec = 0;
    for (var i = 0; i < p.length; i++) {
      var q = p[i].trim();
      if (!/^\d+(\.\d+)?$/.test(q)) return null;
      sec = sec * 60 + parseFloat(q);
    }
    return sec;
  }
  var v = parseNum(s);
  return (v === null || v < 0) ? null : v * 60;
}

function computeSession(st) {
  var segments = [], parts = [], warnings = [];

  function walkSeg(key, label, time, speed) {
    var t = Math.max(0, time), v = Math.max(0, speed);
    return { part: key, label: label, time: t, speed: v, dist: v * t / 3600, walk: true };
  }

  // Oppvarming og nedjogg: gange (valgfri, kun nedjogg) etterfulgt av løping (tid+fart eller distanse+tid).
  function simplePart(key, label, p) {
    var t, v, d;
    if (p.mode === 'dist') {
      d = Math.max(0, parseNum(p.dist) || 0);
      t = Math.max(0, parseTime(p.time) || 0);
      v = t > 0 ? d / (t / 3600) : 0;
      if (d > 0 && t === 0) warnings.push(label + ': mangler tid, så distansen er med i summen, men ikke i løpetid og snittfart.');
    } else {
      t = Math.max(0, parseTime(p.time) || 0);
      v = Math.max(0, parseNum(p.speed) || 0);
      d = v * t / 3600;
    }
    var part = { key: key, label: label, time: t, dist: d, walkTime: 0, walkDist: 0 };
    // Gange kommer først (nedjogg: gå før du jogger)
    var wt = Math.max(0, parseTime(p.walkTime) || 0);
    if (wt > 0) {
      var w = walkSeg(key, label + ', gange', wt, parseNum(p.walkSpeed) || 0);
      segments.push(w);
      part.time += w.time; part.dist += w.dist; part.walkTime = w.time; part.walkDist = w.dist;
    }
    if (t > 0 || d > 0) segments.push({ part: key, label: label, time: t, speed: v, dist: d });
    parts.push(part);
  }

  simplePart('warm', 'Oppvarming', st.warm);

  st.series.forEach(function (s, si) {
    var key = 's' + si, label = 'Serie ' + (si + 1);
    var n = Math.max(0, Math.min(200, parseInt(parseNum(s.count), 10) || 0));
    var t0 = parseTime(s.time) || 0;
    var v0 = parseNum(s.speed) || 0;
    // Fortegnet styres av +/−-knappen; selve feltet leses som en positiv størrelse.
    var dT = Math.abs(parseNum(s.dTime) || 0) * (s.dTimeNeg ? -1 : 1);
    var dV = Math.abs(parseNum(s.dSpeed) || 0) * (s.dSpeedNeg ? -1 : 1);
    // Gange-pause mellom dragene, og egen (gjerne lengre) seriepause etter siste drag
    var wT = Math.max(0, parseTime(s.wTime) || 0);
    var wV = Math.max(0, parseNum(s.wSpeed) || 0);
    var lT = Math.max(0, parseTime(s.wLastTime) || 0);
    var lV = Math.max(0, parseNum(s.wLastSpeed) || 0);
    var drags = [], clamped = false, tt = 0, dd = 0, wtt = 0, wdd = 0;
    for (var i = 0; i < n; i++) {
      var t = t0 + i * dT, v = v0 + i * dV;
      if (t < 0 || v < 0) clamped = true;
      t = Math.max(0, t); v = Math.max(0, v);
      var d = v * t / 3600;
      var drag = { n: i + 1, time: t, speed: v, dist: d, pause: null };
      segments.push({ part: key, label: label + ', drag ' + (i + 1), time: t, speed: v, dist: d });
      tt += t; dd += d;
      var isLast = i === n - 1;
      if ((!isLast && wT > 0) || (isLast && s.wLast && lT > 0)) {
        var w = isLast ? walkSeg(key, label + ', seriepause', lT, lV)
                       : walkSeg(key, label + ', gange etter drag ' + (i + 1), wT, wV);
        w.series = isLast;
        drag.pause = w; segments.push(w);
        tt += w.time; dd += w.dist; wtt += w.time; wdd += w.dist;
      }
      drags.push(drag);
    }
    if (clamped) warnings.push(label + ': endringen gir negativ tid eller fart på slutten. Verdiene er satt til 0.');
    parts.push({ key: key, label: label, time: tt, dist: dd, walkTime: wtt, walkDist: wdd, drags: drags });
  });

  simplePart('cool', 'Nedjogg', st.cool);

  var time = 0, dist = 0, walkTime = 0, walkDist = 0, timedDist = 0;
  parts.forEach(function (p) {
    time += p.time; dist += p.dist; walkTime += p.walkTime; walkDist += p.walkDist;
    if (p.time > 0) timedDist += p.dist; // snittfart over delene med kjent tid
  });
  return {
    segments: segments, parts: parts, warnings: warnings,
    total: { time: time, dist: dist, speed: time > 0 ? timedDist / (time / 3600) : 0, walkTime: walkTime, walkDist: walkDist }
  };
}
/* </logic> */

/* ---------- UI ---------- */
var COLORS = { warm: '#2a9d8f', cool: '#64748b' };
var SERIES_COLORS = ['#e4572e', '#7b61ff', '#d97706', '#0ea5e9'];
function colorFor(key) {
  if (key === 'warm' || key === 'cool') return COLORS[key];
  return SERIES_COLORS[parseInt(key.slice(1), 10) % SERIES_COLORS.length];
}

var state = {
  warm: { mode: 'time', time: '10:00', speed: '9', dist: '' },
  series: [
    { count: '5', time: '3:00', speed: '13', dTime: '0', dTimeNeg: false, dSpeed: '0,5', dSpeedNeg: false, wTime: '1:00', wSpeed: '5', wLast: false, wLastTime: '3:00', wLastSpeed: '5' }
  ],
  cool: { mode: 'time', time: '5:00', speed: '8', dist: '', walkTime: '3:00', walkSpeed: '5' }
};

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function nb(n, dec) { return n.toLocaleString('nb-NO', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtKm(d) { return nb(d, 2) + ' km'; }
function fmtTime(sec) {
  sec = Math.round(sec);
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var ss = (s < 10 ? '0' : '') + s;
  return h > 0 ? h + ':' + (m < 10 ? '0' : '') + m + ':' + ss : m + ':' + ss;
}
function fmtPace(speed) { return speed > 0 ? fmtTime(3600 / speed) : '–'; }

function simpleCard(key, title) {
  var p = state[key];
  var tm = p.mode === 'time';
  var cool = key === 'cool';
  return '<div class="card-head"><h2><span class="dot" style="background:' + colorFor(key) + '"></span>' + title + '</h2>' +
    '<span class="sum" data-sub="' + key + '"></span></div>' +
    (!cool ? '' :
      '<div class="sub-title" style="margin-top:0">Gange før joggingen</div>' +
      '<div class="grid">' +
        '<div><label>Tid (m:ss)</label><div class="field"><input type="text" inputmode="numeric" data-p="cool" data-f="walkTime" data-kind="time" value="' + esc(p.walkTime) + '" placeholder="3:00"></div></div>' +
        '<div><label>Fart</label><div class="field"><input type="text" inputmode="decimal" data-p="cool" data-f="walkSpeed" data-kind="num" value="' + esc(p.walkSpeed) + '" placeholder="5"><span class="unit">km/t</span></div></div>' +
      '</div>' +
      '<p class="hint">La tiden stå tom hvis du ikke gikk først.</p>' +
      '<div class="sub-title">Jogging</div>') +
    '<div class="seg">' +
      '<button class="' + (tm ? 'on' : '') + '" data-action="mode" data-p="' + key + '" data-mode="time">Tid + fart</button>' +
      '<button class="' + (!tm ? 'on' : '') + '" data-action="mode" data-p="' + key + '" data-mode="dist">Distanse + tid</button>' +
    '</div>' +
    '<div class="grid">' +
      '<div><label>Tid (m:ss)</label><div class="field"><input type="text" inputmode="numeric" data-p="' + key + '" data-f="time" data-kind="time" value="' + esc(p.time) + '" placeholder="10:00"></div></div>' +
      (tm
        ? '<div><label>Fart</label><div class="field"><input type="text" inputmode="decimal" data-p="' + key + '" data-f="speed" data-kind="num" value="' + esc(p.speed) + '" placeholder="9"><span class="unit">km/t</span></div></div>'
        : '<div><label>Distanse</label><div class="field"><input type="text" inputmode="decimal" data-p="' + key + '" data-f="dist" data-kind="num" value="' + esc(p.dist) + '" placeholder="1,5"><span class="unit">km</span></div></div>') +
    '</div>' +
    (tm ? '' : '<p class="hint">Tiden brukes til løpetid og snittfart. Hvis du lar den stå tom, regnes bare distansen med.</p>');
}

function seriesCard(s, i) {
  var col = colorFor('s' + i);
  return '<section class="card" data-card="' + i + '">' +
    '<div class="card-head"><h2><span class="dot" style="background:' + col + '"></span>Serie ' + (i + 1) + '</h2>' +
    '<span><span class="sum" data-sub="s' + i + '"></span> <button class="icon-btn" data-action="remove-series" data-s="' + i + '" aria-label="Fjern serie ' + (i + 1) + '">Fjern</button></span></div>' +
    '<div class="grid">' +
      '<div class="full"><label>Antall drag</label><div class="field"><input type="text" inputmode="numeric" data-s="' + i + '" data-f="count" data-kind="int" value="' + esc(s.count) + '"></div></div>' +
    '</div>' +
    '<div class="sub-title">Første drag</div>' +
    '<div class="grid">' +
      '<div><label>Lengde (m:ss)</label><div class="field"><input type="text" inputmode="numeric" data-s="' + i + '" data-f="time" data-kind="time" value="' + esc(s.time) + '" placeholder="3:00"></div></div>' +
      '<div><label>Fart</label><div class="field"><input type="text" inputmode="decimal" data-s="' + i + '" data-f="speed" data-kind="num" value="' + esc(s.speed) + '" placeholder="13"><span class="unit">km/t</span></div></div>' +
    '</div>' +
    '<div class="sub-title">Endring for hvert nye drag</div>' +
    '<div class="grid">' +
      '<div><label>Lengde</label><div class="field">' +
        '<button type="button" class="sign" data-action="sign" data-s="' + i + '" data-f="dTimeNeg" aria-label="Bytt mellom økning og reduksjon">' + (s.dTimeNeg ? '−' : '+') + '</button>' +
        '<input type="text" inputmode="decimal" data-s="' + i + '" data-f="dTime" data-kind="num" value="' + esc(s.dTime) + '"><span class="unit">sek</span></div></div>' +
      '<div><label>Fart</label><div class="field">' +
        '<button type="button" class="sign" data-action="sign" data-s="' + i + '" data-f="dSpeedNeg" aria-label="Bytt mellom økning og reduksjon">' + (s.dSpeedNeg ? '−' : '+') + '</button>' +
        '<input type="text" inputmode="decimal" data-s="' + i + '" data-f="dSpeed" data-kind="num" value="' + esc(s.dSpeed) + '"><span class="unit">km/t</span></div></div>' +
    '</div>' +
    '<p class="hint">Eksempel: 0 sek og +0,5 km/t gir like lange drag som blir 0,5 km/t raskere for hvert drag. −15 sek gir stadig kortere drag.</p>' +
    '<div class="sub-title">Pause med gange/jogg mellom dragene</div>' +
    '<div class="grid">' +
      '<div><label>Tid (m:ss)</label><div class="field"><input type="text" inputmode="numeric" data-s="' + i + '" data-f="wTime" data-kind="time" value="' + esc(s.wTime) + '" placeholder="1:00"></div></div>' +
      '<div><label>Fart</label><div class="field"><input type="text" inputmode="decimal" data-s="' + i + '" data-f="wSpeed" data-kind="num" value="' + esc(s.wSpeed) + '" placeholder="5"><span class="unit">km/t</span></div></div>' +
    '</div>' +
    '<label class="check"><input type="checkbox" data-s="' + i + '" data-f="wLast"' + (s.wLast ? ' checked' : '') + '> Seriepause med gange/jogg etter siste drag</label>' +
    '<div data-lastbox="' + i + '"' + (s.wLast ? '' : ' hidden') + '>' +
      '<div class="grid" style="margin-top:10px">' +
        '<div><label>Seriepause, tid (m:ss)</label><div class="field"><input type="text" inputmode="numeric" data-s="' + i + '" data-f="wLastTime" data-kind="time" value="' + esc(s.wLastTime) + '" placeholder="3:00"></div></div>' +
        '<div><label>Fart</label><div class="field"><input type="text" inputmode="decimal" data-s="' + i + '" data-f="wLastSpeed" data-kind="num" value="' + esc(s.wLastSpeed) + '" placeholder="5"><span class="unit">km/t</span></div></div>' +
      '</div>' +
    '</div>' +
    '<p class="hint">La tiden stå tom for pause uten gange (da regnes ingen distanse). Seriepausen er nyttig når en ny serie følger rett etter.</p>' +
    '<details><summary>Vis dragene</summary><div data-drags="' + i + '"></div></details>' +
  '</section>';
}

function renderForms() {
  document.getElementById('warm').innerHTML = simpleCard('warm', 'Oppvarming');
  document.getElementById('cool').innerHTML = simpleCard('cool', 'Nedjogg');
  var html = '';
  state.series.forEach(function (s, i) { html += seriesCard(s, i); });
  document.getElementById('seriesList').innerHTML = html;
  update();
}

function chartSvg(res) {
  var W = 480, H = 190, L = 34, R = 6, T = 16, B = 22;
  var segs = res.segments.filter(function (s) { return s.time > 0; });
  var total = segs.reduce(function (a, s) { return a + s.time; }, 0);
  if (total <= 0) return '<text x="240" y="95" text-anchor="middle" fill="currentColor" opacity=".5">Legg inn tider for å se grafen</text>';
  var vmax = Math.max.apply(null, segs.map(function (s) { return s.speed; }));
  vmax = Math.max(1, Math.ceil(vmax * 1.1));
  var iw = W - L - R, ih = H - T - B;
  var out = '';
  for (var g = 0; g <= 2; g++) {
    var gv = vmax * g / 2, gy = T + ih - ih * g / 2;
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="currentColor" opacity=".15"/>' +
           '<text x="' + (L - 6) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">' + nb(gv, gv % 1 ? 1 : 0) + '</text>';
  }
  var x = L;
  segs.forEach(function (s) {
    var w = iw * s.time / total, h = ih * s.speed / vmax;
    out += '<rect x="' + x.toFixed(2) + '" y="' + (T + ih - h).toFixed(2) + '" width="' + Math.max(0.5, w).toFixed(2) + '" height="' + h.toFixed(2) + '" fill="' + colorFor(s.part) + '"' + (s.walk ? ' fill-opacity=".4"' : '') + ' stroke="var(--card)" stroke-width="1"><title>' +
           esc(s.label) + ': ' + nb(s.speed, 1) + ' km/t i ' + fmtTime(s.time) + '</title></rect>';
    x += w;
  });
  out += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="currentColor" opacity=".6">0:00</text>' +
         '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">' + fmtTime(total) + '</text>' +
         '<text x="' + (L + 4) + '" y="10" font-size="11" fill="currentColor" opacity=".5">km/t</text>';
  return out;
}

function update() {
  var res = computeSession(state);
  var T = res.total;

  document.getElementById('rDist').textContent = fmtKm(T.dist);
  document.getElementById('rTime').textContent = fmtTime(T.time);
  document.getElementById('rSpeed').textContent = T.speed > 0 ? nb(T.speed, 1) : '–';
  document.getElementById('rPace').textContent = fmtPace(T.speed);
  document.getElementById('barDist').textContent = fmtKm(T.dist);
  document.getElementById('barTime').textContent = fmtTime(T.time) + (T.speed > 0 ? ' · ' + nb(T.speed, 1) + ' km/t' : '');

  document.getElementById('chart').innerHTML = chartSvg(res);
  document.getElementById('legend').innerHTML = res.parts.map(function (p) {
    return '<span><span class="dot" style="background:' + colorFor(p.key) + '"></span>' + p.label + '</span>';
  }).join('') + (T.walkTime > 0 ? '<span><span class="dot" style="background:var(--muted);opacity:.45"></span>Gange (lysere felt)</span>' : '');

  document.getElementById('partRows').innerHTML = res.parts.map(function (p) {
    return '<tr><td><span class="dot" style="background:' + colorFor(p.key) + '"></span>' + p.label + '</td><td>' + fmtTime(p.time) + '</td><td>' + fmtKm(p.dist) + '</td></tr>';
  }).join('') + (T.walkTime > 0 ? '<tr class="walkrow"><td>Herav gange</td><td>' + fmtTime(T.walkTime) + '</td><td>' + fmtKm(T.walkDist) + '</td></tr>' : '')
    + '<tr><td><b>Totalt</b></td><td><b>' + fmtTime(T.time) + '</b></td><td><b>' + fmtKm(T.dist) + '</b></td></tr>';

  document.getElementById('warnings').innerHTML = res.warnings.map(function (w) { return '<p class="warn">' + esc(w) + '</p>'; }).join('');

  res.parts.forEach(function (p) {
    var el = document.querySelector('[data-sub="' + p.key + '"]');
    if (el) el.textContent = fmtKm(p.dist) + ' · ' + fmtTime(p.time);
    if (p.drags) {
      var i = parseInt(p.key.slice(1), 10);
      var box = document.querySelector('[data-drags="' + i + '"]');
      if (box) {
        box.innerHTML = p.drags.length
          ? '<table><thead><tr><th>Drag</th><th>Lengde</th><th>Fart</th><th>Distanse</th></tr></thead><tbody>' +
            p.drags.map(function (d) {
              return '<tr><td>' + d.n + '</td><td>' + fmtTime(d.time) + '</td><td>' + nb(d.speed, 1) + ' km/t</td><td>' + nb(d.dist, 2) + ' km</td></tr>' +
                (d.pause ? '<tr class="walkrow"><td>↳ ' + (d.pause.series ? 'seriepause' : 'gange') + '</td><td>' + fmtTime(d.pause.time) + '</td><td>' + nb(d.pause.speed, 1) + ' km/t</td><td>' + nb(d.pause.dist, 2) + ' km</td></tr>' : '');
            }).join('') + '</tbody><tfoot><tr><td>Sum</td><td>' + fmtTime(p.time) + '</td><td></td><td>' + nb(p.dist, 2) + ' km</td></tr></tfoot></table>'
          : '<p class="hint">Ingen drag.</p>';
      }
    }
  });
}

function validKind(kind, v) {
  if (v.trim() === '') return true;
  if (kind === 'time') return parseTime(v) !== null;
  if (kind === 'int') { var n = parseNum(v); return n !== null && n >= 0 && n === Math.floor(n); }
  return parseNum(v) !== null;
}

document.addEventListener('input', function (e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  var val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type !== 'checkbox') el.classList.toggle('bad', !validKind(el.dataset.kind, el.value));
  if (el.dataset.p) state[el.dataset.p][el.dataset.f] = val;
  else state.series[+el.dataset.s][el.dataset.f] = val;
  if (el.dataset.f === 'wLast') {
    var box = document.querySelector('[data-lastbox="' + el.dataset.s + '"]');
    if (box) box.hidden = !el.checked;
  }
  update();
});

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-action]');
  if (!b) return;
  var a = b.dataset.action;
  if (a === 'mode') { state[b.dataset.p].mode = b.dataset.mode; renderForms(); }
  else if (a === 'add-series') {
    var last = state.series[state.series.length - 1];
    state.series.push(last ? JSON.parse(JSON.stringify(last)) : { count: '4', time: '3:00', speed: '13', dTime: '0', dTimeNeg: false, dSpeed: '0,5', dSpeedNeg: false, wTime: '1:00', wSpeed: '5', wLast: false, wLastTime: '3:00', wLastSpeed: '5' });
    renderForms();
  }
  else if (a === 'remove-series') { state.series.splice(+b.dataset.s, 1); renderForms(); }
  else if (a === 'sign') {
    var s = state.series[+b.dataset.s];
    s[b.dataset.f] = !s[b.dataset.f];
    b.textContent = s[b.dataset.f] ? '−' : '+';
    update();
  }
});

renderForms();
</script>
</body>
</html>
